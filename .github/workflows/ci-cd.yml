name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Job 1: Lint and Type Check
  lint-and-type:
    runs-on: ubuntu-latest
    name: Lint & Type Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # supabase/functions is excluded from tsconfig.json and eslint.config.mjs because it
      # is Deno, not Node. Without this step the Edge Function that Supabase Cron actually
      # invokes would ship with no type check and no lint at all.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check and lint Supabase Edge Functions
        run: npm run lint:functions

  # Job 2: Unit Tests
  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint-and-type

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (with coverage gate)
        run: npm run test:coverage

  # Job 3: Build Application
  build:
    runs-on: ubuntu-latest
    name: Build Application
    needs: [lint-and-type, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        continue-on-error: true

  # Job 3: Security Scan
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: lint-and-type
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run npm audit
        run: |
          set +e
          npm audit --audit-level=high
          audit_exit=$?
          set -e

          if [ "$audit_exit" -ne 0 ]; then
            echo "::warning title=npm audit advisory::npm audit found high severity advisories. Review the audit output above; this security job is advisory and continues to Trivy."
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 4: Deploy to Vercel (Production)
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Built remotely on Vercel rather than locally with --prebuilt --archive=tgz.
      #
      # The prebuilt archive path had been failing on every push to main since
      # 2026-08-02 with:
      #   ENOENT: lstat '/vercel/path0/node_modules/@opentelemetry/api/build/src/api/context.js'
      # Next.js output tracing references that file (it arrives via @sentry/nextjs) but it
      # does not survive the tgz round trip, so listing the deployment files fails. The
      # result was silent: main kept merging while production stopped receiving deploys.
      #
      # A remote build is the path that was verified to work end to end on 2026-08-04.
      # Environment variables come from the Vercel project settings, so they no longer have
      # to be mirrored into GitHub secrets.
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  # Job 5: Deploy to Vercel (Preview)
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    needs: [build, security]
    # Previously `github.event_name == 'push' && github.ref != 'refs/heads/main'`, which
    # could never be true: this workflow only listens to pushes on main and develop, so a
    # feature branch never produced a push event and a main push never satisfied the ref
    # check. The job had therefore never run.
    #
    # That is why the broken deploy went unnoticed for two days: the only path that
    # exercised deployment was production itself, where a failure is silent - main keeps
    # merging while nothing reaches users. Running it on pull requests puts the deploy path
    # in front of a reviewer before it can reach production.
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Same remote build as the production job, for the same reason.
      - name: Deploy to Vercel (preview)
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
